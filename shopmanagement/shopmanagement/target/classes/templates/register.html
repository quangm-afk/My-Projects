<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - GlowWear</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand Logo -->
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <a href="/" style="font-weight: 800; font-size: 1.8rem; color: var(--primary); display: inline-flex; align-items: center; gap: 0.5rem;">
                    <i class="fa-solid fa-bag-shopping"></i> GlowWear
                </a>
            </div>

            <h2 class="auth-title">Đăng ký tài khoản</h2>
            <p class="auth-subtitle">Tham gia mua sắm quần áo thời trang cùng chúng tôi</p>

            <!-- Error Alerts -->
            <div th:if="${error}" class="alert alert-error" style="padding: 0.75rem; font-size: 0.85rem; margin-bottom: 1rem;">
                <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span>
            </div>

            <!-- Registration Form -->
            <form action="/register" method="post" onsubmit="return validateRegisterForm()">
                <div class="form-group">
                    <label class="form-label">Họ và tên của bạn:</label>
                    <input type="text" name="fullName" class="form-control" placeholder="Nhập họ tên đầy đủ..." th:value="${fullName}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Tên đăng nhập:</label>
                    <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập viết liền, không dấu..." th:value="${username}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Mật khẩu:</label>
                    <input type="password" name="password" id="regPassword" class="form-control" placeholder="Nhập mật khẩu..." required>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label">Xác nhận mật khẩu:</label>
                    <input type="password" id="regConfirmPassword" class="form-control" placeholder="Nhập lại mật khẩu..." required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Đăng Ký Tài Khoản <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
                Đã có tài khoản? <a href="/login" style="color: var(--primary); font-weight: 700;">Đăng nhập ngay</a>
            </div>
            
            <div style="text-align: center; margin-top: 1rem;">
                <a href="/" style="font-size: 0.85rem; color: var(--text-muted);"><i class="fa-solid fa-home"></i> Quay lại cửa hàng</a>
            </div>
        </div>
    </div>

    <script>
        function validateRegisterForm() {
            var pass = document.getElementById("regPassword").value;
            var confirmPass = document.getElementById("regConfirmPassword").value;
            if (pass !== confirmPass) {
                alert("Mật khẩu xác nhận không trùng khớp!");
                return false;
            }
            return true;
        }
    </script>

</body>
</html>
